[project]
site_name = "DATUM"
site_url = "https://dnredson.github.io/datum-docs/"
site_description = "Architecture, contracts and evidence for distributed applications across the IoTinuum."
repo_url = "https://github.com/dnredson/datum-docs"
repo_name = "dnredson/datum-docs"
edit_uri = "edit/main/docs/"
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Overview" = [{ "What is DATUM?" = "overview/index.md" }, { "Status and limitations" = "overview/status.md" }] },
  { "Get started" = [{ "Choose a path" = "getting-started/index.md" }, { "First validation" = "examples/first-validation.md" }] },
  { "Tutorials" = [{ "Tutorial map" = "tutorials/index.md" }, { "Install from source" = "tutorials/install.md" }, { "Configure components" = "tutorials/configure.md" }, { "Author software artifacts" = "tutorials/artifacts.md" }, { "Create a D-Graph" = "tutorials/dgraph.md" }, { "Basic governed deploy" = "tutorials/basic-deploy.md" }, { "Runtime realization" = "tutorials/runtime-realization.md" }, { "Troubleshooting" = "tutorials/troubleshooting.md" }] },
  { "Concepts" = [{ "Vocabulary" = "concepts/index.md" }, { "Entity encyclopedia" = "concepts/entities.md" }, { "Identity and references" = "concepts/identities-and-references.md" }] },
  { "Architecture" = [{ "Overview" = "architecture/index.md" }, { "Authority and evidence" = "architecture/authority-and-evidence.md" }, { "Lifecycle and authority flow" = "architecture/lifecycle.md" }] },
  { "Guides and operations" = [{ "Inspect readiness" = "guides/inspect-readiness.md" }, { "Readiness semantics" = "operations/readiness.md" }] },
  { "Reference" = [{ "Reference map" = "reference/index.md" }, { "Canonical contracts" = "reference/contracts.md" }, { "Core control-plane API" = "reference/core-api.md" }, { "Complete HTTP API" = "reference/http-api.md" }, { "Readiness APIs" = "reference/readiness-api.md" }, { "Sources and provenance" = "reference/sources.md" }] },
  { "Project" = [{ "Architecture decisions" = "project/decisions.md" }, { "Contributing" = "project/contributing.md" }, { "Roadmap" = "project/roadmap.md" }] },
]

[project.theme]
language = "en"
custom_dir = "overrides"
logo = "assets/brand/datum-monochrome.png"
favicon = "assets/brand/datum-icon.png"
features = ["navigation.sections", "navigation.top", "navigation.footer", "navigation.indexes", "content.code.copy", "content.action.edit", "search.highlight"]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "cyan"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "cyan"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
